<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Firebase</title>
</head>

<body>
<h2>Upload ảnh Firebase</h2>

<input type="file" id="fileInput" multiple>
<button onclick="uploadImages()">Upload</button>

<div id="preview"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

// ✅ CONFIG ĐÃ FIX
const firebaseConfig = {
  apiKey: "AIzaSyDGQqB3NtdO_sDHAqS3l9VXthixcafCTe4",
  authDomain: "hoangsonland-cfea5.firebaseapp.com",
  projectId: "hoangsonland-cfea5",
  storageBucket: "hoangsonland-cfea5.appspot.com", // 🔥 QUAN TRỌNG
  messagingSenderId: "544947429383",
  appId: "1:544947429383:web:31385cfde96253e80a8aa2"
};

// INIT
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const storage = getStorage(app);
const db = getFirestore(app);

// LOGIN ẨN DANH
signInAnonymously(auth)
  .then(() => console.log("Đăng nhập ẩn danh OK"))
  .catch(err => console.error("Auth lỗi:", err));

// UPLOAD
window.uploadImages = async () => {
  const files = document.getElementById("fileInput").files;
  const preview = document.getElementById("preview");

  if (!files.length) return alert("Chọn ảnh trước!");

  let urls = [];

  for (const file of files) {
    try {
      const fileName = `img_${Date.now()}_${Math.random().toString(36).slice(2)}`;
      const storageRef = ref(storage, `properties/${fileName}`);

      console.log("Đang upload:", fileName);

      const snapshot = await uploadBytes(storageRef, file);
      const url = await getDownloadURL(snapshot.ref);

      urls.push(url);

      preview.innerHTML += `<img src="${url}" width="120">`;

    } catch (err) {
      console.error("UPLOAD ERROR:", err);
      alert("Lỗi upload: " + err.message);
    }
  }

  // Lưu Firestore
  try {
    await addDoc(collection(db, "testUploads"), {
      images: urls,
      createdAt: serverTimestamp()
    });

    alert("Upload + lưu DB thành công 🎉");

  } catch (err) {
    console.error("Firestore ERROR:", err);
  }
};
</script>

</body>
</html>
