<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hoàng Sơn Nhà Thuê - Cần Thơ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDGQqB3NtdO_sDHAqS3l9VXthixcafCTe4",
            authDomain: "hoangsonland-cfea5.firebaseapp.com",
            projectId: "hoangsonland-cfea5",
            storageBucket: "hoangsonland-cfea5.firebasestorage.app",
            messagingSenderId: "544947429383",
            appId: "1:544947429383:web:31385cfde96253e80a8aa2",
            measurementId: "G-5QX699Y2VL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const storage = getStorage(app);
        const appId = "hoang-son-land-final";

        window.db = db;
        window.storage = storage;
        window.collectionPath = ['artifacts', appId, 'public', 'data', 'properties'];

        signInAnonymously(auth).catch(console.error);
        onAuthStateChanged(auth, (user) => { window.currentUser = user; });
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .admin-modal { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px); }
        .property-card { border: 1px solid #f1f5f9; border-radius: 24px; overflow: hidden; background: white; }
        /* Tối ưu mobile */
        @media (max-width: 640px) {
            .hero-title { font-size: 2.8rem !important; line-height: 1.1 !important; }
            .hero-desc { font-size: 0.95rem !important; }
        }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900">

    <!-- Navigation -->
    <header class="glass-header fixed top-0 w-full z-[100] border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                    <i data-lucide="building-2" class="w-5 h-5"></i>
                </div>
                <div class="leading-none">
                    <h1 class="text-base font-extrabold tracking-tight uppercase">Hoàng Sơn</h1>
                    <p class="text-[9px] text-slate-400 font-bold tracking-widest mt-0.5">NHÀ THUÊ CẦN THƠ</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="checkAdmin()" class="p-2 text-slate-400 hover:text-blue-600"><i data-lucide="user-cog" class="w-5 h-5"></i></button>
                <a href="tel:0901026345" class="bg-blue-600 text-white px-4 py-2 rounded-full font-bold text-xs flex items-center gap-2">
                    <i data-lucide="phone" class="w-3.5 h-3.5"></i> 0901 026 345
                </a>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <section class="pt-28 pb-12 px-6 bg-white">
        <div class="max-w-7xl mx-auto text-center lg:text-left flex flex-col lg:flex-row items-center gap-10">
            <div class="lg:w-1/2 space-y-6">
                <p class="text-orange-600 font-extrabold text-[10px] uppercase tracking-[0.2em]">Dịch vụ nhà thuê chuyên nghiệp</p>
                <h2 class="hero-title text-5xl lg:text-7xl font-serif font-extrabold text-slate-900">Hoàng Sơn <br><span class="text-blue-600 italic">Nhà Thuê</span></h2>
                <p class="hero-desc text-slate-500 text-base leading-relaxed max-w-md mx-auto lg:mx-0">Tìm nhà thuê, phòng trọ, mặt bằng chất lượng cao tại Cần Thơ. Hỗ trợ tận tâm, pháp lý rõ ràng.</p>
                
                <div class="flex flex-col gap-3 max-w-sm mx-auto lg:mx-0">
                    <a href="tel:0901026345" class="bg-blue-600 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-3 shadow-xl shadow-blue-100">
                        <i data-lucide="phone-call" class="w-5 h-5"></i> Liên Hệ Ngay
                    </a>
                    <a href="https://zalo.me/0901026345" class="border border-blue-100 text-blue-700 py-4 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-blue-50 transition">
                        Zalo: 0901 026 345
                    </a>
                </div>

                <div class="pt-4 flex items-center justify-center lg:justify-start gap-6 text-[11px] font-bold text-slate-400 uppercase tracking-widest">
                    <span class="flex items-center gap-1.5"><i data-lucide="check-circle" class="w-4 h-4 text-green-500"></i> 100+ Căn</span>
                    <span class="flex items-center gap-1.5"><i data-lucide="check-circle" class="w-4 h-4 text-green-500"></i> Uy tín</span>
                    <span class="flex items-center gap-1.5"><i data-lucide="check-circle" class="w-4 h-4 text-green-500"></i> Tận tâm</span>
                </div>
            </div>
            <div class="lg:w-1/2 w-full">
                <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1200" class="w-full h-[300px] lg:h-[500px] object-cover rounded-[2.5rem] shadow-2xl">
            </div>
        </div>
    </section>

    <!-- Properties -->
    <main id="properties" class="max-w-7xl mx-auto px-5 py-12">
        <div class="flex items-center justify-between mb-8">
            <h3 class="text-2xl font-serif font-bold">Danh sách mới</h3>
            <div class="h-1 flex-1 mx-4 bg-slate-100 rounded-full"></div>
        </div>
        <div id="propGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- Admin Modal -->
    <div id="adminModal" class="hidden fixed inset-0 z-[200] admin-modal flex items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-4xl rounded-t-[2.5rem] sm:rounded-[2.5rem] shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
            <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between">
                <h3 class="font-extrabold text-lg flex items-center gap-2"><i data-lucide="plus-circle" class="text-blue-600"></i> Đăng tin mới</h3>
                <button onclick="closeAdmin()" class="p-2 bg-slate-50 rounded-full"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <div class="p-6 overflow-y-auto space-y-6">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2 tracking-widest">Nội dung bài đăng</label>
                    <textarea id="fbInput" rows="6" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 focus:bg-white focus:ring-2 focus:ring-blue-600 outline-none text-sm transition" placeholder="Dán nội dung từ Facebook vào đây..."></textarea>
                </div>

                <div class="space-y-3">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest">Hình ảnh thực tế</label>
                    <div id="uploadPreview" class="hidden grid grid-cols-4 gap-2 pb-2"></div>
                    <label class="flex flex-col items-center justify-center w-full h-28 border-2 border-dashed border-slate-200 rounded-2xl bg-slate-50 hover:bg-blue-50 cursor-pointer transition">
                        <input type="file" id="fileInp" class="hidden" multiple accept="image/*" onchange="handleUpload(this)">
                        <i data-lucide="camera" class="w-6 h-6 text-slate-400 mb-1"></i>
                        <span class="text-[11px] font-bold text-slate-400" id="upStatus">Chọn ảnh nhà (Nên chọn từ 3-5 ảnh)</span>
                    </label>
                </div>

                <button id="btnSave" onclick="saveData()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-3 shadow-lg shadow-blue-100">
                    <i data-lucide="upload-cloud" class="w-5 h-5"></i> CẬP NHẬT WEBSITE
                </button>

                <div class="pt-4">
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-4 tracking-widest">Quản lý tin cũ</p>
                    <div id="quickList" class="space-y-2"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";
        import { collection, addDoc, onSnapshot, query, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let currentUrls = [];

        window.checkAdmin = () => {
            const pw = prompt("Mật mã Admin:");
            if(pw === "2110") document.getElementById('adminModal').classList.remove('hidden');
        };
        window.closeAdmin = () => document.getElementById('adminModal').classList.add('hidden');

        window.handleUpload = async (input) => {
            const files = Array.from(input.files);
            const preview = document.getElementById('uploadPreview');
            const status = document.getElementById('upStatus');
            
            preview.innerHTML = ''; preview.classList.remove('hidden');
            currentUrls = [];
            status.innerText = "Đang tải ảnh...";

            for (const f of files) {
                const name = `img_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
                const sRef = ref(window.storage, `properties/${name}`);
                try {
                    const snap = await uploadBytes(sRef, f);
                    const url = await getDownloadURL(snap.ref);
                    currentUrls.push(url);
                    preview.innerHTML += `<img src="${url}" class="w-full aspect-square object-cover rounded-xl border border-slate-200 shadow-sm">`;
                } catch (e) {
                    alert("Lỗi tải ảnh: " + e.message);
                }
            }
            status.innerText = `Đã tải ${currentUrls.length} ảnh ✅`;
        };

        window.saveData = async () => {
            const text = document.getElementById('fbInput').value;
            if(!text.trim()) return alert("Nhập nội dung Sơn ơi!");
            
            const btn = document.getElementById('btnSave');
            btn.disabled = true; btn.innerText = "Đang đồng bộ...";

            const lines = text.split('\n').filter(l => l.trim());
            const price = (text.match(/([\d.]+tr)/i) || ["", "Liên hệ"])[1].toUpperCase();

            const data = {
                title: (lines.find(l => l.includes('NHÀ')) || lines[0] || "NHÀ THUÊ MỚI").replace('CG - ', '').trim(),
                price: price,
                deposit: (text.match(/Cọc:\s*([\d\s\w]+)/i) || ["", "02 tháng"])[1].trim(),
                structure: (lines.find(l => l.toLowerCase().includes('kết cấu')) || "Liên hệ 0901 026 345").split(/[:-]/).pop().trim(),
                street: (lines.find(l => l.toLowerCase().includes('lộ giới')) || "Liên hệ Hoàng Sơn").split(/[:-]/).pop().trim(),
                images: currentUrls.length > 0 ? currentUrls : ["https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1200"],
                createdAt: serverTimestamp()
            };

            try {
                await addDoc(collection(window.db, ...window.collectionPath), data);
                document.getElementById('fbInput').value = '';
                document.getElementById('uploadPreview').innerHTML = '';
                currentUrls = [];
                alert("Đăng bài thành công!");
                closeAdmin();
            } catch (e) {
                alert("Lỗi: " + e.message);
            } finally {
                btn.disabled = false; btn.innerText = "CẬP NHẬT WEBSITE";
            }
        };

        function startSync() {
            if(!window.db) return setTimeout(startSync, 500);
            const q = query(collection(window.db, ...window.collectionPath));
            onSnapshot(q, (snap) => {
                const list = [];
                snap.forEach(d => list.push({id: d.id, ...d.data()}));
                list.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                
                // Grid render
                document.getElementById('propGrid').innerHTML = list.map(p => `
                    <div class="property-card shadow-sm flex flex-col">
                        <div class="h-60 relative overflow-hidden">
                            <img src="${p.images[0]}" class="w-full h-full object-cover">
                            <div class="absolute bottom-4 left-4 bg-white/95 px-4 py-2 rounded-2xl font-extrabold text-blue-600 shadow-xl border border-blue-50">${p.price}</div>
                        </div>
                        <div class="p-6 flex-1 flex flex-col">
                            <h4 class="font-bold text-slate-900 leading-tight mb-4 uppercase line-clamp-2 h-10 text-[15px]">${p.title}</h4>
                            <div class="space-y-3 mb-6 text-slate-500 text-[13px]">
                                <p class="flex items-center gap-2"><i data-lucide="layers" class="w-4 h-4 text-blue-500"></i> ${p.structure}</p>
                                <p class="flex items-center gap-2"><i data-lucide="navigation" class="w-4 h-4 text-blue-500"></i> ${p.street}</p>
                            </div>
                            <div class="mt-auto pt-5 border-t border-slate-50 flex items-center justify-between">
                                <div>
                                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Tiền cọc</p>
                                    <p class="font-bold text-slate-800 text-sm">${p.deposit}</p>
                                </div>
                                <a href="tel:0901026345" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-bold text-xs">Liên hệ</a>
                            </div>
                        </div>
                    </div>
                `).join('');

                // Quick list
                document.getElementById('quickList').innerHTML = list.map(p => `
                    <div class="bg-slate-50 p-3 rounded-xl flex items-center gap-3 border border-slate-100">
                        <img src="${p.images[0]}" class="w-10 h-10 rounded-lg object-cover">
                        <div class="flex-1 min-w-0">
                            <p class="text-[10px] font-bold truncate uppercase">${p.title}</p>
                            <p class="text-[9px] text-blue-600 font-bold">${p.price}</p>
                        </div>
                        <button onclick="deletePost('${p.id}')" class="text-red-400 p-2"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                `).join('');

                if(window.lucide) window.lucide.createIcons();
            });
        }

        window.deletePost = async (id) => {
            if(confirm("Xóa tin này nhé?")) await deleteDoc(doc(window.db, ...window.collectionPath, id));
        };

        startSync();
    </script>
</body>
</html>
