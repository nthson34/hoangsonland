<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoàng Sơn Nhà Thuê</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
body { font-family: sans-serif; }
.property-card { transition: 0.2s; }
.property-card:active { transform: scale(0.98); }
</style>
</head>

<body class="bg-gray-50 pb-20">

<header class="p-4 bg-white shadow flex justify-between">
    <h1 class="font-bold">Hoàng Sơn Nhà Thuê</h1>
    <a href="tel:0901026345">📞</a>
</header>

<main class="p-4">
    <h2 class="font-bold mb-4">Danh sách nhà</h2>
    <div id="grid">Đang tải dữ liệu...</div>
</main>

<button onclick="openAdmin()" style="position:fixed;bottom:20px;right:20px;">➕</button>

<div id="admin" style="display:none;position:fixed;inset:0;background:#0008;">
    <div style="background:white;padding:20px;margin:40px;">
        <textarea id="text" placeholder="Dán nội dung..." style="width:100%"></textarea>
        <input type="file" id="file" multiple>
        <button onclick="save()">Đăng</button>
        <button onclick="closeAdmin()">Đóng</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyDGQqB3NtdO_sDHAqS3l9VXthixcafCTe4",
  authDomain: "hoangsonland-cfea5.firebaseapp.com",
  projectId: "hoangsonland-cfea5",
  storageBucket: "hoangsonland-cfea5.appspot.com", // ✅ FIX
  messagingSenderId: "544947429383",
  appId: "1:544947429383:web:31385cfde96253e80a8aa2"
};

let db, storage, auth;

try {
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    storage = getStorage(app);
    auth = getAuth(app);

    await signInAnonymously(auth);
    console.log("Firebase OK");

    loadData();

} catch (e) {
    console.error("Firebase lỗi:", e);
    document.getElementById("grid").innerText = "Lỗi kết nối Firebase!";
}

// LOAD DATA
function loadData() {
    const q = query(collection(db, "properties"));

    onSnapshot(q, snap => {
        let html = "";

        snap.forEach(doc => {
            const d = doc.data();
            html += `
                <div class="property-card bg-white p-4 mb-3 rounded shadow">
                    <img src="${d.images?.[0] || ''}" style="width:100%;height:150px;object-fit:cover">
                    <h3>${d.title || ''}</h3>
                    <p>${d.price || ''}</p>
                </div>
            `;
        });

        document.getElementById("grid").innerHTML = html || "Chưa có dữ liệu";
        lucide.createIcons();
    });
}

// ADMIN UI
window.openAdmin = () => {
    const pass = prompt("Mã:");
    if(pass === "2110") document.getElementById("admin").style.display = "block";
};
window.closeAdmin = () => document.getElementById("admin").style.display = "none";

// SAVE DATA
window.save = async () => {
    const text = document.getElementById("text").value;
    const files = document.getElementById("file").files;

    if(!text) return alert("Nhập nội dung!");

    let urls = [];

    for (const file of files) {
        try {
            const name = "img_" + Date.now();
            const storageRef = ref(storage, "properties/" + name);

            const snap = await uploadBytes(storageRef, file);
            const url = await getDownloadURL(snap.ref);

            urls.push(url);

        } catch(e) {
            console.error(e);
            alert("Lỗi upload: " + e.message);
        }
    }

    await addDoc(collection(db, "properties"), {
        title: text.split("\n")[0],
        price: text.match(/[\d.]+tr/i)?.[0] || "Liên hệ",
        images: urls,
        createdAt: serverTimestamp()
    });

    alert("Đăng thành công!");
};
</script>

</body>
</html>
